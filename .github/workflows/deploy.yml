name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Gate ─────────────────────────────────────────────────────────
  validate:
    name: Validate Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Deployment not confirmed. Type 'deploy' to proceed."
          exit 1

      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deployments only from main branch."
          exit 1

  # ── Deploy ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            cd ${{ secrets.DEPLOY_PATH || '~/wow-mount-tracker' }}

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building images..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "==> Stopping old containers..."
            docker compose -f docker-compose.prod.yml down --timeout 30

            echo "==> Starting new containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            echo "==> Waiting for health check..."
            sleep 10
            curl -f http://127.0.0.1:81/api/health || exit 1

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            curl -sf http://127.0.0.1:81/api/health | jq .
