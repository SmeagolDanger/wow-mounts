name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Backend Lint & Security ──────────────────────────────────────
  backend-lint:
    name: Backend Lint & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff bandit safety

      - name: Ruff lint
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        run: ruff format --check app/

      - name: Bandit security scan
        run: bandit -r app/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Bandit summary
        if: always()
        run: bandit -r app/ -c pyproject.toml -ll

      - name: Check for known vulnerabilities
        run: pip-audit --requirement requirements.txt || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  # ── Docker Build Verification ────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true 
          tags: wow-mount-tracker-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm -d \
            --name test-api \
            -e APP_ENV=development \
            -p 8000:8000 \
            wow-mount-tracker-api:${{ github.sha }}

          # Wait for startup
          sleep 5

          # Health check
          curl -f http://localhost:8000/api/health || (docker logs test-api && exit 1)

          docker stop test-api

  # ── Docker Compose Validation ────────────────────────────────────
  compose-check:
    name: Validate Compose Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          BNET_CLIENT_ID: test
          BNET_CLIENT_SECRET: test
          BNET_REDIRECT_URI: http://localhost
          SECRET_KEY: test-secret-key-at-least-32-characters-long
          CORS_ORIGINS: http://localhost
          RATE_LIMIT_PER_MINUTE: "60"
