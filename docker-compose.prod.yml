# docker-compose.prod.yml
#
# Pulls API image from GitHub Container Registry.
# All secrets loaded from .env.prod via env_file.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# First time on a new host:
#   echo $GHCR_TOKEN | docker login ghcr.io -u YOUR_GITHUB_USER --password-stdin

services:
  api:
    image: ghcr.io/${GHCR_OWNER:-your-github-user}/wow-mount-tracker-api:${IMAGE_TAG:-latest}
    build: ./backend
    ports:
      - "127.0.0.1:81:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BNET_CLIENT_ID: ${BNET_CLIENT_ID}
      BNET_CLIENT_SECRET: ${BNET_CLIENT_SECRET}
      BNET_REGION: ${BNET_REGION:-us}
      BNET_REDIRECT_URI: ${BNET_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
