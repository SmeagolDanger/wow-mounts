# docker-compose.override.yml — automatically loaded in dev
# Restores hot-reload, source mounts, and exposed DB port
services:
  api:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development

  db:
    ports:
      - "5433:5432"
