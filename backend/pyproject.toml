[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "S105",  # hardcoded password (false positives on config defaults)
    "S106",  # hardcoded password
    "B008",  # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]  # FastAPI Depends() in function signatures

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B104"]  # B101: assert in tests, B104: 0.0.0.0 bind is intentional in Docker
